; Qt palette for everything the Terminal-wide skin's stylesheet doesn't reach:
; Mixxx's dialogs (preferences, track properties, message boxes, file pickers)
; and their menus. Colours are the skin's Btop palette
; (tools/terminal_skin/palettes/btop.json in the Mixxx appliance tree).
;
; One colour per QPalette::ColorRole, in enum order: WindowText, Button, Light,
; Midlight, Dark, Mid, Text, BrightText, ButtonText, Base, Window, Shadow,
; Highlight, HighlightedText, Link, LinkVisited, AlternateBase, NoRole,
; ToolTipBase, ToolTipText, PlaceholderText, Accent.
;
; Window is a shade off black, not the skin's pure black: Fusion draws its
; frames in Window darkened, so on black every line edit and group box would
; lose its outline. Base (text fields, lists) is black like the skin's wells.
[ColorScheme]
active_colors=#ffb7c7ad, #ff272a25, #ff596154, #ff3b4037, #ff0a0b09, #ff181a16, #ffb7c7ad, #ffddf0d1, #ffb7c7ad, #ff000000, #ff121411, #ff000000, #ff323d2b, #ffddf0d1, #ff42c9d6, #ffea3c96, #ff0c0d0b, #ff000000, #ff000000, #ffb7c7ad, #ff6c7566, #ff93d64a
disabled_colors=#ff6c7566, #ff272a25, #ff596154, #ff3b4037, #ff0a0b09, #ff181a16, #ff6c7566, #ff929e8a, #ff6c7566, #ff000000, #ff121411, #ff000000, #ff272a25, #ff929e8a, #ff42c9d6, #ffea3c96, #ff0c0d0b, #ff000000, #ff000000, #ffb7c7ad, #ff6c7566, #ff446322
